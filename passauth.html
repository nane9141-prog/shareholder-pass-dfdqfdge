<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PASS 인증</title>
<style>
  :root{
    --red:#EC1C24; --ink:#17171C; --sub:#6B6B73; --line:#E6E6EA;
    --bg:#FFFFFF; --foot:#F4F4F6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:flex;flex-direction:column;letter-spacing:-.02em}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

  /* ── 상단 ─────────────────────────────── */
  .hd{flex:none;display:flex;align-items:center;gap:12px;padding:22px 24px 0}
  .logo{display:flex;align-items:center;gap:10px}
  .mark{height:30px;padding:0 9px;border-radius:3px;background:var(--red);color:#fff;
    display:flex;align-items:center;font-size:20px;font-weight:800;letter-spacing:.02em}
  .mark img{height:30px;display:block}
  .tag{font-size:11.5px;line-height:15px;color:#9A9AA2;font-weight:500}
  .lang{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:#55555D}
  .lang svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6}

  /* ── 본문 ─────────────────────────────── */
  .bd{flex:1;min-height:0;overflow-y:auto;padding:36px 24px 24px}
  .scr{display:none}
  .scr.on{display:block}

  /* 1단계 — 인증방법 선택 */
  h1{font-size:27px;font-weight:800;line-height:1.35;letter-spacing:-.035em}
  .ways{margin-top:34px;display:flex;flex-direction:column;gap:12px}
  .way{width:100%;display:flex;align-items:center;gap:14px;padding:22px 20px;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:12px;transition:.15s}
  .way:hover{border-color:#C9C9D1}
  .way:active{background:#FAFAFB}
  .way .c{flex:1;min-width:0;display:flex;flex-direction:column}
  .way .t{display:block;font-size:18px;font-weight:800;letter-spacing:-.03em}
  .way .d{display:block;margin-top:6px;font-size:13.5px;color:var(--sub)}
  .way .ic{flex:none;width:44px;height:44px;color:#D4D4DA}
  .way .ic svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round}

  /* 2단계 — QR 인증 */
  .lead{font-size:17px;font-weight:700;line-height:1.55;letter-spacing:-.03em}
  .lead b{color:var(--red)}
  .rule{height:1px;background:var(--line);margin:24px 0}
  .qrow{display:flex;align-items:center;gap:18px}
  .qrbox{flex:none;width:118px;height:118px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:6px}
  .qrbox canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  .or{flex:none;font-size:14px;color:var(--sub)}
  .code{flex:1;text-align:right;font-size:33px;font-weight:800;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums}
  .tmrow{margin-top:26px;display:flex;align-items:center;gap:8px}
  .tmrow .clk{width:19px;height:19px;flex:none;color:#9A9AA2}
  .tmrow .clk svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}
  .tm{font-size:15px;font-weight:700}
  .tm b{color:var(--red);font-variant-numeric:tabular-nums}
  .ext{margin-left:auto;font-size:13.5px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
  .note{margin-top:30px;text-align:center;font-size:13.5px;line-height:1.7;color:var(--sub)}
  .note b{color:#55555D;font-weight:700}
  .go{margin-top:20px;width:100%;height:56px;border-radius:8px;background:var(--red);color:#fff;
    font-size:18px;font-weight:800;letter-spacing:-.03em}
  .go:active{background:#D4181F}
  .go[disabled]{background:#E3E3E7;color:#A8A8B0}
  /* 인증 완료 */
  .okwrap{padding:60px 0 0;text-align:center}
  .okic{width:76px;height:76px;margin:0 auto;border-radius:50%;background:#FDECEC;color:var(--red);
    display:flex;align-items:center;justify-content:center}
  .okic svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:3;
    stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;
    animation:draw .45s ease-out .1s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .okwrap h2{margin-top:22px;font-size:22px;font-weight:800;letter-spacing:-.03em}
  .okwrap p{margin-top:10px;font-size:14px;color:var(--sub);line-height:1.6}

  /* ── 하단 ─────────────────────────────── */
  .ft{flex:none;background:var(--foot);padding:16px 24px;display:flex;align-items:center;gap:12px}
  .ft .l{flex:1;min-width:0;font-size:11.5px;line-height:1.7;color:#8A8A92}
  .ft .l b{color:#55555D;font-weight:700}
  .nice{flex:none;border:1px solid #C9C9D1;border-radius:2px;padding:3px 7px;
    font-size:10.5px;font-weight:700;color:#55555D;background:#fff;white-space:nowrap}
</style>
</head>
<body>

<div class="hd">
  <div class="logo">
    <span class="mark" id="mark">PASS</span>
    <span class="tag">인증을 넘어<br>일상으로 PASS</span>
  </div>
  <span class="lang">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
    KO
    <svg viewBox="0 0 24 24" style="width:12px;height:12px"><path d="m6 9 6 6 6-6"/></svg>
  </span>
</div>

<div class="bd">

  <!-- 1 · 인증방법 선택 -->
  <section class="scr on" id="s1">
    <h1>인증방법을<br>선택해주세요</h1>
    <div class="ways">
      <button class="way" type="button" data-w="app">
        <span class="c"><span class="t">PASS 인증</span><span class="d">앱으로 간편하고 안전하게!</span></span>
        <span class="ic"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M9.5 6.5 8 8l1.5 1.5M14.5 6.5 16 8l-1.5 1.5"/></svg></span>
      </button>
      <button class="way" type="button" data-w="qr">
        <span class="c"><span class="t">QR코드 인증</span><span class="d">QR코드 스캔으로 간편하게!</span></span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></span>
      </button>
      <button class="way" type="button" data-w="sms">
        <span class="c"><span class="t">문자(SMS) 인증</span><span class="d">SMS 인증번호로 본인확인</span></span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-4 4V6Z"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg></span>
      </button>
    </div>
  </section>

  <!-- 2 · QR 인증 -->
  <section class="scr" id="s2">
    <p class="lead">PASS앱 실행 후, 상단의 QR인증에서<br><b>QR코드 스캔</b> 또는 <b>인증번호 입력</b>을<br>선택해 주세요</p>
    <div class="rule"></div>
    <div class="qrow">
      <div class="qrbox"><canvas id="qr" width="232" height="232"></canvas></div>
      <span class="or">또는</span>
      <span class="code" id="code">0000000</span>
    </div>
    <div class="tmrow">
      <span class="clk"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span class="tm">남은시간 <b id="left">4 34</b></span>
      <button class="ext" type="button" id="ext">시간연장</button>
    </div>
    <p class="note">자동으로 인증 처리가 안될 경우<br>아래의 <b>‘인증 완료’</b> 버튼을 눌러주세요</p>
    <button class="go" type="button" id="go">인증완료</button>
  </section>

  <!-- 3 · 완료 -->
  <section class="scr" id="s3">
    <div class="okwrap">
      <div class="okic"><svg viewBox="0 0 24 24"><path d="m4 12.5 5.5 5.5L20 7"/></svg></div>
      <h2>본인확인이 완료되었습니다</h2>
      <p>창이 곧 닫힙니다.<br>주주총회 화면에서 의결권을 행사해 주세요.</p>
    </div>
  </section>

</div>

<div class="ft">
  <div class="l"><b>이용약관</b> &nbsp;<b>개인정보처리방침</b> &nbsp;도움말<br>VeriSign 256-bit SSL 암호화 적용</div>
  <span class="nice">NICE평가정보</span>
</div>

<script>
(function(){
  'use strict';
  var $=function(s){ return document.querySelector(s); };
  var ORIGIN=location.origin;

  /* 로고 이미지가 있으면 쓰고, 없으면 글자로 둔다 */
  (function(){
    var img=new Image();
    img.onload=function(){ $('#mark').innerHTML=''; $('#mark').style.cssText='background:none;padding:0'; $('#mark').appendChild(img); };
    img.onerror=function(){};
    img.alt='PASS'; img.src='assets/pass-logo.png';
  })();

  function show(id){
    document.querySelectorAll('.scr').forEach(function(s){ s.classList.toggle('on', s.id===id); });
    $('.bd').scrollTop=0;
  }

  /* QR — 실제 인증이 아니므로 모양만 그린다 */
  function drawQR(seed){
    var cv=$('#qr'), g=cv.getContext('2d'), N=29, u=cv.width/N, r=seed||1;
    function rnd(){ r=(r*1103515245+12345)&0x7fffffff; return r/0x7fffffff; }
    g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
    for(var y=0;y<N;y++) for(var x=0;x<N;x++){
      var inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
      if(inF) continue;
      if(rnd()>0.5){ g.fillStyle='#17171C'; g.fillRect(x*u,y*u,u,u); }
    }
    function finder(x,y){
      g.fillStyle='#17171C'; g.fillRect(x*u,y*u,7*u,7*u);
      g.fillStyle='#fff';    g.fillRect((x+1)*u,(y+1)*u,5*u,5*u);
      g.fillStyle='#17171C'; g.fillRect((x+2)*u,(y+2)*u,3*u,3*u);
    }
    finder(0,0); finder(N-7,0); finder(0,N-7);
  }

  var T=null, left=294;                      /* 4분 54초 */
  function paint(){
    var m=Math.floor(left/60), s=left%60;
    $('#left').textContent=m+' '+(s<10?'0':'')+s;
  }
  function tick(){
    clearInterval(T);
    paint();
    T=setInterval(function(){
      left--; paint();
      if(left<=0){ clearInterval(T); done(false); }
    },1000);
  }
  function openQR(){
    drawQR(Date.now()%100000);
    $('#code').textContent=String(1000000+Math.floor(Math.random()*8999999));
    left=294; tick();
    show('s2');
    /* 시연용 — 앱에서 승인한 것으로 보고 잠시 뒤 자동으로 넘어간다 */
    clearTimeout(openQR.t);
    openQR.t=setTimeout(function(){ if($('#s2').classList.contains('on')) done(true); }, 7000);
  }

  function done(ok){
    clearInterval(T); clearTimeout(openQR.t);
    if(!ok){ reply(false); window.close(); return; }
    show('s3');
    reply(true);
    setTimeout(function(){ window.close(); }, 1600);
  }
  function reply(ok){
    try{
      if(window.opener && !window.opener.closed)
        window.opener.postMessage({ cxPass:true, ok:!!ok }, ORIGIN);
    }catch(e){}
  }

  document.querySelectorAll('.way').forEach(function(b){
    b.addEventListener('click', function(){
      /* 시연 범위 — 어떤 방법을 골라도 QR 단계로 간다 */
      openQR();
    });
  });
  $('#go').addEventListener('click', function(){ done(true); });
  $('#ext').addEventListener('click', function(){ left=294; tick(); });
  window.addEventListener('beforeunload', function(){ if($('#s3').classList.contains('on')) return; reply(false); });
})();
</script>
</body>
</html>
